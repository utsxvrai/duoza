# Fly.io config for the Duoza relay. Deploy with: fly deploy
app = "duoza-relay"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.relay"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DUOZA_RELAY_DB = "/data/duoza-relay.sqlite"
  DUOZA_CLIENT_IP_HEADER = "fly-client-ip"

[[mounts]]
  source = "duoza_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Listeners hold WebSockets open and the mailbox lives here, so never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
